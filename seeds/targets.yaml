# Collection `targets` — model ID thật nằm trong env, không hard-code
- _id: vendorA:large
  vendor: vendorA
  kind: real
  model_ref: { env_var: VENDOR_A_LARGE_MODEL }
  adapter: openai_compat
  base_url_ref: CHAOS_PROXY_URL/vendorA
  price: { in_per_mtok: 3.0, out_per_mtok: 15.0, currency: USD }
  capabilities: { json_mode: true, tools: true, streaming: true, max_context: 200000 }
  tier: large
  capacity_hint_rps: 30
  enabled: true
- _id: vendorA:small
