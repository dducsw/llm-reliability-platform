[project]
name = "reflex-control-plane"
version = "0.1.0"
description = "Control plane (modular monolith): sentinel, incidents, policy engine, actuator, verifier, time machine, BFF"
requires-python = ">=3.12"
dependencies = [
    "reflex-core",
    "reflex-mongo",
    "reflex-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.5",
    "scipy>=1.14",
]

[project.scripts]
reflex-control-plane = "reflex_cp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflex_cp"]
