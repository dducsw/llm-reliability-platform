[project]
name = "reflex-cortex"
version = "0.1.0"
description = "Cortex — AI SRE agent: investigate, propose bounded actions, write postmortems"
requires-python = ">=3.12"
dependencies = [
    "reflex-core",
    "reflex-mongo",
    "reflex-telemetry",
    "openai>=1.50",  # gọi LLM qua Reflex gateway (OpenAI-compatible), route cortex.reason
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
reflex-cortex = "reflex_cortex.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflex_cortex"]
