[project]
name = "reflex-gateway"
version = "0.1.0"
description = "Data plane: OpenAI-compatible LLM gateway với quality-aware routing"
requires-python = ">=3.12"
dependencies = [
    "reflex-core",
    "reflex-mongo",
    "reflex-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.5",
]

[project.scripts]
reflex-gateway = "reflex_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflex_gateway"]
