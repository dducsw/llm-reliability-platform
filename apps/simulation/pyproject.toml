[project]
name = "reflex-sim"
version = "0.1.0"
description = "Workload & chaos: ShopMate traffic, mock-llm, chaos-proxy, prober, scenario runner, bench importer"
requires-python = ">=3.12"
dependencies = [
    "reflex-core",
    "reflex-mongo",
    "reflex-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "pyyaml>=6.0",
    "scipy>=1.14",
]

[project.scripts]
reflex-sim = "reflex_sim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflex_sim"]
