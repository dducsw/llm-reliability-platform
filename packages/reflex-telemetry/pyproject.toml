[project]
name = "reflex-telemetry"
version = "0.1.0"
description = "ddtrace + LLMObs + structlog + DogStatsD init, tag catalog, Datadog API client"
requires-python = ">=3.12"
dependencies = [
    "reflex-core",
    "ddtrace>=2.14",
    "datadog>=0.50",
    "datadog-api-client>=2.28",
    "structlog>=24.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflex_telemetry"]
