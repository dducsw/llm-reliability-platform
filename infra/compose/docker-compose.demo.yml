# Override cho env demo: MongoDB Atlas (bỏ mongo local), nginx TLS, vendor thật qua chaos-proxy.
services:
  mongo:
    profiles: [disabled]

  nginx:
    image: nginx:1.27-alpine
    ports: ["443:443", "80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      REFLEX_WEBHOOK_TOKEN: ${REFLEX_WEBHOOK_TOKEN}
    depends_on: [control-plane, console]
