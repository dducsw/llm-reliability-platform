# https://taskfile.dev — `task --list` để xem toàn bộ lệnh
version: "3"

dotenv: [".env"]

vars:
  COMPOSE: docker compose -f infra/compose/docker-compose.yml
  COMPOSE_ATLAS: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.atlas.yml
  COMPOSE_DEMO: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.demo.yml

tasks:
  install:
    desc: Cài dependency Python (uv) và Console (pnpm)
    cmds:
      - uv sync --all-packages
      - pnpm --dir apps/console install

  up:
    desc: Khởi động toàn bộ stack local
    cmds:
      - "{{.COMPOSE}} up -d --build"

  up:atlas:
    desc: Stack nhẹ, Mongo = Atlas (MONGODB_URI trong .env); vd `task up:atlas -- gateway-1 gateway-2 chaos-proxy mock-llm datadog-agent`
    cmds:
      - "{{.COMPOSE_ATLAS}} up -d --build {{.CLI_ARGS}}"

  down:
    desc: Tắt stack
    cmds:
      - "{{.COMPOSE}} down"

  logs:
    desc: Theo dõi log, vd `task logs -- gateway-1`
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  seed:
    desc: Migrate Mongo + seed catalog/slos/policies + import bench_ts + incident history
    cmds:
      - uv run reflex-mongo migrate
      - uv run reflex-mongo seed --dir seeds
      - uv run reflex-sim bench import --days 60
      - uv run python tools/bootstrap_memory.py

  memory:bootstrap:
    desc: Nạp 50 sự cố mẫu có vector signature 64D vào Incident Memory
    cmds:
      - uv run python tools/bootstrap_memory.py

  cortex:eval:
    desc: Chạy eval harness cho Cortex Agent và xuất báo cáo cortex-eval.md (DE-7.4)
    cmds:
      - uv run python tools/eval_cortex.py

  migrate:
    desc: Tạo collections, TS, index, TTL, validators, search indexes (idempotent)
    cmds:
      - uv run reflex-mongo migrate

  lint:
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy packages/reflex-core
      - uv run lint-imports

  fmt:
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Unit tests
    cmds:
      - uv run pytest -m "not integration and not e2e" {{.CLI_ARGS}}

  test:integration:
    cmds:
      - uv run pytest -m integration {{.CLI_ARGS}}

  test:e2e:
    cmds:
      - uv run pytest -m e2e tests/e2e {{.CLI_ARGS}}

  scenario:
    desc: Chạy scenario, vd `task scenario -- silent-brownout`
    cmds:
      - uv run reflex-sim run {{.CLI_ARGS}} --seed 42

  schemas:
    desc: Export JSON Schema (Mongo validators) + sinh TS types cho Console
    cmds:
      - uv run python tools/export_schemas.py
      - pnpm --dir apps/console gen:api

  infra:datadog:plan:
    desc: terraform plan -out tfplan (key lấy từ .env; REFLEX_WEBHOOK_URL = URL công khai tới /hooks/datadog)
    dir: infra/terraform
    env: &tfenv
      TF_VAR_dd_api_key: "{{.DD_API_KEY}}"
      TF_VAR_dd_app_key: "{{.DD_APP_KEY}}"
      TF_VAR_dd_site: "{{.DD_SITE}}"
      TF_VAR_env: '{{.REFLEX_ENV | default "local"}}'
      TF_VAR_webhook_token: "{{.REFLEX_WEBHOOK_TOKEN}}"
      TF_VAR_webhook_url: "{{.REFLEX_WEBHOOK_URL}}"
    cmds:
      - terraform init -upgrade
      - terraform plan -out tfplan

  infra:datadog:apply:
    desc: Apply đúng file tfplan đã plan (không -auto-approve)
    dir: infra/terraform
    env: *tfenv
    cmds:
      - uv run python ../../tools/setup_datadog_metrics.py
      - terraform apply tfplan

  infra:datadog:sync:
    desc: Ghi id SLO/monitor Datadog vào slos.datadog (dry-run; `-- --yes` để ghi). Chạy lại sau `task seed`
    cmds:
      - uv run python tools/sync_datadog_ids.py {{.CLI_ARGS}}

  demo:up:
    desc: Stack demo (Atlas, nginx TLS, vendor thật)
    cmds:
      - "{{.COMPOSE_DEMO}} up -d --build"

  demo:record:
    desc: Chạy scenario chính ở chế độ quay video
    cmds:
      - uv run python tools/record_demo.py {{.CLI_ARGS}}

  demo:reset:
    desc: Dọn trạng thái runtime giữa các lần quay (dry-run; `task demo:reset -- --yes` để xoá)
    cmds:
      - uv run python tools/demo_reset.py {{.CLI_ARGS}}

  loadtest:
    desc: Load test gateway 50 rps × 30 phút, đo overhead + chi phí Mongo (SE-9.2)
    cmds:
      - uv run python tools/loadtest.py --gateway http://localhost:8080 --gateway http://localhost:8081 {{.CLI_ARGS}}

  chaos:self:
    desc: Tắt lần lượt mongo / dd-agent / cortex / control-plane / gateway-1, xác nhận fail-safe (SE-9.1)
    cmds:
      - uv run python tools/chaos_self.py {{.CLI_ARGS}}

  judge:verify:
    desc: Chạy kiểm chứng và xuất Proof Report cho Ban Giám Khảo trong 3 phút (I4)
    cmds:
      - uv run python tools/judge_verify.py
