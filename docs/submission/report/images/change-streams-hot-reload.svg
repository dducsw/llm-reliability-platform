<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <marker id="arr1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 6 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #000000; }
    .title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .stereo { font-size: 10px; font-style: italic; fill: #444444; }
    .name { font-size: 12px; font-weight: bold; }
    .sub { font-size: 10px; fill: #333333; }
    .flow { font-size: 10px; fill: #000000; font-weight: 500; }
  </style>

  <!-- Background White -->
  <rect width="880" height="260" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- Title -->
  <text x="25" y="24" class="title">ZERO-DOWNTIME POLICY HOT-RELOAD VIA MONGODB CHANGE STREAMS</text>
  <line x1="25" y1="32" x2="855" y2="32" stroke="#000000" stroke-width="1"/>

  <!-- Step 1: Control Plane Actuator (Left) -->
  <g transform="translate(25, 55)">
    <rect width="200" height="160" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="100" y="26" text-anchor="middle" class="stereo">&lt;&lt;control-plane&gt;&gt;</text>
    <text x="100" y="46" text-anchor="middle" class="name">Policy Actuator</text>
    <line x1="15" y1="56" x2="185" y2="56" stroke="#000000" stroke-width="0.5"/>
    <text x="100" y="80" text-anchor="middle" class="sub">• Guardrails Passed</text>
    <text x="100" y="98" text-anchor="middle" class="sub">• Bounded Action Chosen</text>
    <text x="100" y="116" text-anchor="middle" class="sub">• New Policy Version (v17)</text>
    <rect x="25" y="128" width="150" height="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="100" y="142" text-anchor="middle" class="flow">1. ACID Transaction</text>
  </g>

  <!-- Step 2: MongoDB Atlas (Center) -->
  <g transform="translate(300, 55)">
    <rect width="240" height="160" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="120" y="26" text-anchor="middle" class="stereo">&lt;&lt;database&gt;&gt;</text>
    <text x="120" y="46" text-anchor="middle" class="name">MongoDB Atlas</text>
    <line x1="15" y1="56" x2="225" y2="56" stroke="#000000" stroke-width="0.5"/>
    <text x="120" y="78" text-anchor="middle" class="sub">Collection: "policies"</text>
    <text x="120" y="94" text-anchor="middle" class="sub">{ version: 17, route: ... }</text>
    <line x1="15" y1="106" x2="225" y2="106" stroke="#000000" stroke-width="0.5"/>
    <text x="120" y="126" text-anchor="middle" class="sub">Replica Set Oplog Event</text>
    <rect x="25" y="132" width="190" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="120" y="145" text-anchor="middle" class="flow">2. Change Streams Emit</text>
  </g>

  <!-- Step 3: Reflex Gateway (Right) -->
  <g transform="translate(615, 55)">
    <rect width="240" height="160" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="120" y="26" text-anchor="middle" class="stereo">&lt;&lt;data-plane&gt;&gt;</text>
    <text x="120" y="46" text-anchor="middle" class="name">Reflex Gateway Nodes</text>
    <line x1="15" y1="56" x2="225" y2="56" stroke="#000000" stroke-width="0.5"/>
    <text x="120" y="78" text-anchor="middle" class="sub">Background Coroutine Cursor</text>
    <text x="120" y="94" text-anchor="middle" class="sub">In-Memory Pointer Swap</text>
    <text x="120" y="112" text-anchor="middle" class="sub">Active Sockets Kept Alive</text>
    <rect x="25" y="128" width="190" height="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="120" y="142" text-anchor="middle" class="flow">3. Applied in &lt; 1 Second</text>
  </g>

  <!-- Connecting Arrows -->
  <line x1="225" y1="135" x2="300" y2="135" stroke="#000000" stroke-width="1.5" marker-end="url(#arr1)"/>
  <rect x="235" y="122" width="55" height="12" fill="#ffffff"/>
  <text x="262" y="131" text-anchor="middle" class="flow">Insert/Set</text>

  <line x1="540" y1="135" x2="615" y2="135" stroke="#000000" stroke-width="1.5" marker-end="url(#arr1)"/>
  <rect x="550" y="122" width="55" height="12" fill="#ffffff"/>
  <text x="577" y="131" text-anchor="middle" class="flow">Push &lt;1s</text>

</svg>

