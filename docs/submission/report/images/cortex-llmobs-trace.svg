<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <marker id="arr3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 6 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #000000; }
    .title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .stereo { font-size: 10px; font-style: italic; fill: #444444; }
    .name { font-size: 12px; font-weight: bold; }
    .sub { font-size: 10px; fill: #333333; }
    .timing { font-size: 10px; font-weight: bold; fill: #000000; }
    .flow { font-size: 10px; fill: #000000; font-weight: 500; }
  </style>

  <!-- Background White -->
  <rect width="880" height="280" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- Title -->
  <text x="25" y="24" class="title">DATADOG LLM OBSERVABILITY — CORTEX INVESTIGATION DISTRIBUTED TRACE</text>
  <line x1="25" y1="32" x2="855" y2="32" stroke="#000000" stroke-width="1"/>

  <!-- Root Span (Top) -->
  <g transform="translate(25, 48)">
    <rect width="830" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="26" class="name">Root Span: cortex.investigation.workflow</text>
    <text x="450" y="26" class="sub">Total Execution Time</text>
    <text x="750" y="26" class="timing">[12.4s]</text>
  </g>

  <!-- Child Step 1 -->
  <g transform="translate(60, 102)">
    <rect width="795" height="34" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="20" y="22" class="name">1. fetch_metrics (Datadog API)</text>
    <text x="320" y="22" class="sub">Query Error Budget Burn Rate</text>
    <text x="715" y="22" class="timing">[450ms]</text>
  </g>

  <!-- Child Step 2 -->
  <g transform="translate(60, 142)">
    <rect width="795" height="34" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="20" y="22" class="name">2. vector_search (MongoDB Atlas)</text>
    <text x="320" y="22" class="sub">64D Incident Signature Match ($vectorSearch)</text>
    <text x="715" y="22" class="timing">[18ms]</text>
  </g>

  <!-- Child Step 3 -->
  <g transform="translate(60, 182)">
    <rect width="795" height="34" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="20" y="22" class="name">3. query_logs (Datadog Log Management)</text>
    <text x="320" y="22" class="sub">Scan @finish_reason:length &amp; stack traces</text>
    <text x="715" y="22" class="timing">[320ms]</text>
  </g>

  <!-- Child Step 4 -->
  <g transform="translate(60, 222)">
    <rect width="795" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="20" y="22" class="name">4. llm_reasoning (OpenAI GPT-4o Model Call)</text>
    <text x="320" y="22" class="sub">Input: 1,840 tokens | Output: 240 tokens | Proposed: shift_weight</text>
    <text x="715" y="22" class="timing">[11.2s]</text>
  </g>

  <!-- Trace Hierarchy Tree Lines -->
  <line x1="42" y1="90" x2="42" y2="242" stroke="#000000" stroke-width="1"/>
  <line x1="42" y1="119" x2="60" y2="119" stroke="#000000" stroke-width="1"/>
  <line x1="42" y1="159" x2="60" y2="159" stroke="#000000" stroke-width="1"/>
  <line x1="42" y1="199" x2="60" y2="199" stroke="#000000" stroke-width="1"/>
  <line x1="42" y1="242" x2="60" y2="242" stroke="#000000" stroke-width="1"/>

</svg>

